apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nfl-picks
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts: [nfl.kosar.sk]
      secretName: nfl-picks-tls
  rules:
    - host: nfl.kosar.sk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nfl-picks
                port: {name: http}
