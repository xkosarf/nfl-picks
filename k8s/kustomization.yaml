apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nfl-picks
resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - cronjob.yaml
images:
  - name: ghcr.io/xkosarf/nfl-picks
    # Set by the release workflow on every push to main. Never "latest" (Kyverno blocks it).
    newTag: sha-initial
